services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ceramiflow
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "3306:3306"
    volumes:
      - ceramiflow_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  ceramiflow_mysql:
